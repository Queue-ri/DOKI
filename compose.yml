# EC2 내부에서 실행되는 스크립트
# 루트 경로에 .env 파일 있어야 함 (Actions로 하든지 수동으로 하든지..)
networks:
  doki:
    driver: bridge
  elk: # elk 네트워크의 컨테이너를 연결하기 위해 작성
    external: true
    name: doki_elk

services:
  # Service Discovery 설정
  service-discovery:
    container_name: service-discovery
    build:
      context: .
      dockerfile: service-discovery.Dockerfile
    image: qriosity/doki_service-discovery:latest
    ports:
      - 8761:8761
    networks:
      - doki

  # API Gateway 설정
  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: api-gateway.Dockerfile
    image: qriosity/doki_api-gateway:latest
    ports:
      - 9000:9000
    environment:
      SPRING_PROFILES_ACTIVE: docker # environment로 설정하기 복잡해서 분리함
    depends_on: 
      - service-discovery
      - common-service
      - reserve-service
    networks:
      - doki

  # Reserve Service 설정
  reserve-service:
    container_name: reserve-service
    build:
      context: .
      dockerfile: reserve-service.Dockerfile
    image: qriosity/doki_reserve-service:latest
    ports: 
      - 9091:9091
    depends_on:
      - service-discovery
    environment:
      spring.profiles.include: production
      spring.datasource.url: ${DB_ENDPOINT}
      spring.datasource.username: ${DB_USERNAME}
      spring.datasource.password: ${DB_PASSWORD}
      spring.jpa.hibernate.ddlAuto: update
      eureka.client.serviceUrl.defaultZone: http://service-discovery:8761/eureka
      spring.data.redis.host: ${REDIS_HOST}
      kafka.host: ${KAFKA_HOST}
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    networks:
      - doki
      - elk
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Common Service 설정
  common-service:
    container_name: common-service
    build:
      context: .
      dockerfile: common-service.Dockerfile
    image: qriosity/doki_common-service:latest
    ports: 
      - 9093:9093
    depends_on:
      - service-discovery
    environment:
      spring.profiles.include: production
      spring.datasource.url: ${DB_ENDPOINT}
      spring.datasource.username: ${DB_USERNAME}
      spring.datasource.password: ${DB_PASSWORD}
      spring.jpa.hibernate.ddlAuto: update
      spring.mail.username: ${MAIL_USERNAME}
      spring.mail.password: ${MAIL_PASSWORD}
      cloud.aws.credentials.accessKey: ${S3_ACCESS_KEY}
      cloud.aws.credentials.secretKey: ${S3_SECRET_KEY}
      eureka.client.serviceUrl.defaultZone: http://service-discovery:8761/eureka
      spring.data.redis.host: ${REDIS_HOST}
      kafka.host: ${KAFKA_HOST}
      elasticsearch.host: elasticsearch:9200
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    networks:
      - doki
      - elk
    extra_hosts:
      - "host.docker.internal:host-gateway"